# docker-compose 部署示例
# 使用方法：
#   1. 复制 .env.example 为 .env，填入你的 API Key 等配置
#   2. docker compose up -d
#   3. 浏览器访问 http://localhost:8765
#
# 如需启用 Langfuse 可观测平台：
#   docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up -d
#   Langfuse UI: http://localhost:3000（首次需注册账号）

services:
  xsolve:
    build: .
    container_name: xsolve
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - xsolve-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8765/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  xsolve-data:
