<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" type="text/css">
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 16px; color:#222; }
  #box { width: 100%; max-width: 620px; height: 420px; border:1px solid #e0e0e0; border-radius:8px; }
  .step-info { margin: 12px 0; padding: 10px 14px; background:#f5f7fa; border-left:4px solid #4c6ef5; border-radius:6px; min-height: 20px; }
  #progress { color:#666; font-size:13px; margin-bottom:8px; }
  button { padding:8px 18px; margin-right:8px; cursor:pointer; border:none; border-radius:6px; background:#4c6ef5; color:#fff; font-size:14px; }
  button:disabled { background:#c5cae9; cursor:not-allowed; }
  button.ghost { background:#fff; color:#4c6ef5; border:1px solid #4c6ef5; }
</style>
</head>
<body>
<h2>__TITLE__</h2>
<div id="progress">进度：0 / __N__ 步</div>
<div id="box" class="jxgbox"></div>
<div class="step-info" id="info">点击「下一步」开始作图</div>
<button id="next">下一步 ▶</button>
<button id="reset" class="ghost">重置 ↺</button>

<script>
if (typeof JXG === 'undefined') {
  document.getElementById('info').textContent = '⚠️ JSXGraph 加载失败：请检查网络是否能访问 cdn.jsdelivr.net（CDN 被拦截时按钮会无反应）。';
} else {
const board = JXG.JSXGraph.initBoard('box', {
  boundingbox: __BOUNDINGBOX__,          // [xmin, ymax, xmax, ymin]
  axis: __AXIS__, showCopyright: false,  // 是否显示默认坐标轴（默认 false，不画）
  keepaspectratio: true                  // 关键：1 单位 x = 1 单位 y（像素），保证图形不被拉变形
});

// ===== 辅助函数（内置，直接调用即可，无需写完整 board.create） =====
function pt(x,y,name,opt={}){return board.create('point',[x,y],Object.assign({name,visible:false,fixed:true,size:4,strokeColor:'#333',fillColor:'#333'},opt))}
function seg(p1,p2,opt={}){return board.create('segment',[p1,p2],Object.assign({visible:false,strokeColor:'#333',strokeWidth:2},opt))}
function circ(c,e,opt={}){return board.create('circle',[c,e],Object.assign({visible:false,strokeColor:'#868e96',dash:2},opt))}
function txt(x,y,s,opt={}){return board.create('text',[x,y,s],Object.assign({visible:false,fontSize:13,anchorX:'mid',color:'#333'},opt))}
function poly(pts,opt={}){return board.create('polygon',pts,Object.assign({visible:false,fillColor:'#e3f2fd',fillOpacity:0.4,strokeColor:'#333',strokeWidth:1},opt))}
function arc(c,p1,p2,opt={}){return board.create('arc',[c,p1,p2],Object.assign({visible:false,strokeColor:'#868e96',strokeWidth:2},opt))}
function perp(p1,line2,opt={}){return board.create('perpendicular',[p1,line2],Object.assign({visible:false,strokeColor:'#e03131',dash:3,strokeWidth:1},opt))}
function para(p1,line2,opt={}){return board.create('parallelsegment',[p1,line2],Object.assign({visible:false,strokeColor:'#1971c2',strokeWidth:2},opt))}
function func(f,opt={}){return board.create('functiongraph',[f],Object.assign({visible:false,strokeColor:'#e03131',strokeWidth:2},opt))}

// ===== 在此用辅助函数预建所有元素（初始 visible:false），并定义 steps 数组 =====
// 每个 step: { els: [元素, ...], text: '第 n 步说明' }
__SETUP__

// ===== 以下为通用揭示 / 重置逻辑，一般无需改动 =====
let cur = 0;
const info = document.getElementById('info');
const prog = document.getElementById('progress');
const nextBtn = document.getElementById('next');
const resetBtn = document.getElementById('reset');
function applyStep() {
  if (cur >= steps.length) return;
  steps[cur].els.forEach(e => e.setAttribute({visible:true}));
  info.textContent = steps[cur].text;
  cur++;
  prog.textContent = '进度：' + cur + ' / ' + steps.length + ' 步';
  if (cur >= steps.length) nextBtn.disabled = true;
}
function reset() {
  steps.forEach(s => s.els.forEach(e => e.setAttribute({visible:false})));
  cur = 0; nextBtn.disabled = false;
  prog.textContent = '进度：0 / ' + steps.length + ' 步';
  info.textContent = '点击「下一步」开始作图';
}
nextBtn.addEventListener('click', applyStep);
resetBtn.addEventListener('click', reset);
}
</script>
</body>
</html>
